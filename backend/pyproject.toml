readme = "README.md"
authors = [
    { name = "Akash111", email = "godlike89765@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "groq>=1.7.0",
    "pydantic>=2.14.3",
    "pypdf>=7.0.0",
